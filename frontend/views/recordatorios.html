<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventBot AI — Recordatorios</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="../css/eventbot.css" rel="stylesheet">
</head>
<body>
<div class="eb-layout">
    <div id="sidebar"></div>
    <main class="eb-main">
        <header class="eb-header">
            <div class="eb-header-title">
                <h1>Recordatorios</h1>
                <p>RECORDATORIOS · RESERVAS</p>
            </div>
            <div class="eb-header-right">
                <span id="apiStatus" class="api-status offline"><span class="dot"></span> Verificando...</span>
                <div class="eb-avatar" id="headerAvatar">AD</div>
            </div>
        </header>
        <div class="eb-content">

            <!-- STATS -->
            <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px">
                <div class="eb-stat">
                    <div class="eb-stat-icon" style="background:#DBEAFE">🔔</div>
                    <div>
                        <div class="eb-stat-val" style="color:#2563EB" id="statTotal">—</div>
                        <div class="eb-stat-label">Total recordatorios</div>
                        <div class="eb-stat-sub">RECORDATORIOS COUNT(*)</div>
                    </div>
                </div>
                <div class="eb-stat">
                    <div class="eb-stat-icon" style="background:#FEF3C7">⏳</div>
                    <div>
                        <div class="eb-stat-val" style="color:#D97706" id="statPend">—</div>
                        <div class="eb-stat-label">Pendientes</div>
                        <div class="eb-stat-sub">estado = pendiente</div>
                    </div>
                </div>
                <div class="eb-stat">
                    <div class="eb-stat-icon" style="background:#DCFCE7">✅</div>
                    <div>
                        <div class="eb-stat-val" style="color:#16A34A" id="statEnv">—</div>
                        <div class="eb-stat-label">Enviados</div>
                        <div class="eb-stat-sub">estado = enviado</div>
                    </div>
                </div>
            </div>

            <!-- LISTA -->
            <div class="eb-card">
                <div class="eb-search-bar">
                    <div class="eb-search-wrap">
                        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                        </svg>
                        <input class="eb-search" placeholder="Buscar mensaje..." oninput="filtrar(this.value)">
                    </div>
                    <select class="eb-search" style="max-width:150px" id="filtroTipo" onchange="filtrar()">
                        <option value="">Todos</option>
                        <option>WhatsApp</option>
                        <option>encuesta</option>
                        <option>pago</option>
                    </select>
                    <button class="eb-btn eb-btn-primary eb-btn-sm" onclick="abrirModal()">+ Nuevo recordatorio</button>
                </div>

                <div id="listaRecordatorios">
                    <div style="padding:20px;text-align:center;color:#94A3B8">Cargando...</div>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- MODAL -->
<div class="eb-modal-overlay" id="modalRec">
    <div class="eb-modal">
        <div class="eb-modal-header">
            <div class="eb-modal-title">🔔 Nuevo recordatorio</div>
            <button class="eb-modal-close" onclick="cerrarModal()">✕</button>
        </div>
        <div class="eb-modal-body">
            <div class="eb-form-group">
                <label class="eb-label">ID Reserva</label>
                <input class="eb-input" id="rec-reserva" type="number" placeholder="1024">
            </div>
            <div class="eb-form-row">
                <div class="eb-form-group">
                    <label class="eb-label">Tipo</label>
                    <select class="eb-input" id="rec-tipo">
                        <option>WhatsApp</option>
                        <option>encuesta</option>
                        <option>pago</option>
                    </select>
                </div>
                <div class="eb-form-group">
                    <label class="eb-label">Fecha programada</label>
                    <input class="eb-input" id="rec-fecha" type="datetime-local">
                </div>
            </div>
            <div class="eb-form-group">
                <label class="eb-label">Mensaje</label>
                <textarea class="eb-input" id="rec-mensaje" rows="3" placeholder="Mensaje del recordatorio..."></textarea>
            </div>
        </div>
        <div class="eb-modal-footer">
            <button class="eb-btn eb-btn-secondary" onclick="cerrarModal()">Cancelar</button>
            <button class="eb-btn eb-btn-primary" onclick="guardarRecordatorio()">Guardar</button>
        </div>
    </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/sidebar.js"></script>
<script>
    Auth.require();
    let todosRecs = [];

    async function cargarRecordatorios() {
        try {
            const res = await ApiRecordatorios.listar();
            todosRecs = res.data || res || [];
            document.getElementById("statTotal").textContent = todosRecs.length;
            document.getElementById("statPend").textContent = todosRecs.filter(r => r.estado === "pendiente").length;
            document.getElementById("statEnv").textContent = todosRecs.filter(r => r.estado === "enviado").length;
            renderLista(todosRecs);
        } catch {
            document.getElementById("listaRecordatorios").innerHTML =
                `<div style="padding:20px;text-align:center;color:#DC2626">❌ Error conectando con FastAPI</div>`;
        }
    }

    function renderLista(lista) {
        const div = document.getElementById("listaRecordatorios");
        if (!lista.length) {
            div.innerHTML = `<div style="padding:20px;text-align:center;color:#94A3B8">Sin recordatorios</div>`;
            return;
        }
        const colores = { WhatsApp: "#25D366", encuesta: "#2563EB", pago: "#D97706" };
        div.innerHTML = lista.map(r => `
            <div class="eb-reminder">
                <div class="eb-reminder-dot" style="background:${colores[r.tipo]||'#94A3B8'}"></div>
                <div style="flex:1">
                    <div class="eb-reminder-title">${r.tipo} · Reserva #${r.idReservas||r.reserva}</div>
                    <div class="eb-reminder-sub">${r.mensaje||"—"}</div>
                    <div class="eb-reminder-sub" style="margin-top:4px">
                        📅 ${formatDate(r.fecha_programada)} · 
                        ${r.estado==="pendiente"
                            ? `<span style="color:#D97706;font-weight:600">⏳ pendiente</span>`
                            : `<span style="color:#16A34A;font-weight:600">✅ enviado</span>`}
                    </div>
                </div>
                <div style="display:flex;gap:6px">
                    <button class="eb-btn eb-btn-success eb-btn-sm" onclick="marcarEnviado(${r.idRecordatorio||r.id})">✅</button>
                    <button class="eb-btn eb-btn-danger eb-btn-sm">🗑</button>
                </div>
            </div>
        `).join("");
    }

    function filtrar(q = "") {
        const tipo = document.getElementById("filtroTipo").value;
        let filtrados = todosRecs.filter(r =>
            (r.mensaje||"").toLowerCase().includes(q.toLowerCase())
        );
        if (tipo) filtrados = filtrados.filter(r => r.tipo === tipo);
        renderLista(filtrados);
    }

    function abrirModal() { document.getElementById("modalRec").classList.add("open"); }
    function cerrarModal() { document.getElementById("modalRec").classList.remove("open"); }

    async function guardarRecordatorio() {
        const idReservas = parseInt(document.getElementById("rec-reserva").value);
        const tipo = document.getElementById("rec-tipo").value;
        const mensaje = document.getElementById("rec-mensaje").value.trim();
        const fecha_programada = document.getElementById("rec-fecha").value;
        if (!idReservas || !mensaje) { showToast("⚠️ Reserva y mensaje requeridos", "warning"); return; }
        try {
            await ApiRecordatorios.crear({ idReservas, tipo, mensaje, fecha_programada, estado: "pendiente" });
            showToast("✅ Recordatorio creado", "success");
            cerrarModal();
            cargarRecordatorios();
        } catch { showToast("❌ Error al guardar", "error"); }
    }

    async function marcarEnviado(id) {
        showToast("✅ Marcado como enviado", "success");
        cargarRecordatorios();
    }

    cargarRecordatorios();
</script>
</body>
</html>
